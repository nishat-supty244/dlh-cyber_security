    command_or_action: "After preserving task XML, remove task {7B4F2D81-19E2-4A8C-9E67-A1F0DE2C7B3A} using Task Scheduler or schtasks /Delete /TN '<verified task path>' /F."
    verification_command: "PowerShell: Get-ScheduledTask | Where-Object { $_.TaskName -match '7B4F2D81-19E2-4A8C-9E67-A1F0DE2C7B3A' }; inspect EDR scheduled-task inventory."
    expected_verification_result: "No matching scheduled task or EDR persistence event after remediation."
    status: pending
    executed_at: null
    executed_by: null

  - id: ERAD-003
    category: malware_artifact
    target_host: WST-WS-031
    description: Remove HKCU Run key WindowsUpdateSvc pointing to update.exe.
    command_or_action: "After exporting the key for evidence, remove the WindowsUpdateSvc value from HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Run in dmarsh's user hive."
    verification_command: "PowerShell: Get-ItemProperty -Path 'Registry::HKEY_USERS\\<dmarsh-SID>\\Software\\Microsoft\\Windows\\CurrentVersion\\Run' -Name WindowsUpdateSvc -ErrorAction SilentlyContinue; inspect endpoint persistence telemetry."
    expected_verification_result: "No WindowsUpdateSvc value in the correct user hive and no matching persistence alert."
