# Eradication Checklist — IR-2026-0414-01

**Purpose:** Plan removal of attacker access and verify that each eradication action is effective.

**Status:** Planned. No actions are claimed as executed.

**Scope:** `WST-WS-031`, `WST-WS-017`, `LIS-WSIDE-01`, `MEDDEFENSE\dmarsh`, Active Directory/Kerberos, and C2 destinations `185.220.101.47` and `91.234.99.107`.

> Preserve forensic evidence before changing systems. Coordinate host isolation and restoration with the clinical lead. A `krbtgt` double reset requires separate evidence and authorization; observed lateral movement alone does not prove `krbtgt` compromise.

