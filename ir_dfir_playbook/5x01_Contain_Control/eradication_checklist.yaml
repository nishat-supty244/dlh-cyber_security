# MedDefense Incident IR-2026-0414-01
# Planned eradication steps. No action is represented as already executed.
items:
  - id: ERAD-001
    category: malware_artifact
    target_host: WST-WS-031
    description: Remove dropped update.xml and update.exe after preserving forensic copies and hashes.
    command_or_action: "Following evidence capture and approved rebuild/remediation, remove C:\\Users\\dmarsh\\AppData\\Local\\Temp\\update.xml and update.exe; prefer clean reimage if host trust is lost."
    verification_command: "PowerShell: Test-Path 'C:\\Users\\dmarsh\\AppData\\Local\\Temp\\update.xml'; Test-Path 'C:\\Users\\dmarsh\\AppData\\Local\\Temp\\update.exe'; compare EDR live-response inventory."
    expected_verification_result: "Both Test-Path results False; EDR reports neither file."
    status: pending
    executed_at: null
    executed_by: null

  - id: ERAD-002
    category: malware_artifact
    target_host: WST-WS-031
