    verification_command: "Inspect firewall policy and deny logs; query timestamp-scoped netflow for both destinations after rule commit, with source and destination filters."
    expected_verification_result: "Both rules active; no successful post-commit C2 flows; any attempted traffic is denied and logged."
    status: pending
