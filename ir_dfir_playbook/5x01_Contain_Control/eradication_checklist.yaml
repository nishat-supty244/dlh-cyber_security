### ERAD-013 — Assess need for a carefully staged krbtgt double reset if Golden Ticket forgery or krbtgt secret compromise is confirmed.

- **Category:** `krbtgt`
- **Target host:** `domain`
- **Command or action:** Decision gate: investigate ticket anomalies, domain controller compromise, and krbtgt exposure; if confirmed, use Microsoft-supported krbtgt reset procedure twice with verified replication and change authorization.
- **Verification command:** Review domain controller replication health, krbtgt password version changes, new TGT issuance, and authentication failures/anomalies across the domain.
- **Expected verification result:** Either documented no-reset decision supported by evidence, or both authorized resets completed with healthy replication and no accepted forged/old-ticket use.
- **Rationale:** Observed TGS requests and lateral movement do not alone prove Pass-the-Ticket or krbtgt secret theft. Do not automatically double-reset krbtgt. If investigation confirms krbtgt compromise, coordinate two resets with AD owners, allow full replication between resets, and follow domain-specific Kerberos ticket-lifetime and operational safeguards.
- **Status:** `pending`
- **Executed at:** Not executed (`null`)
- **Executed by:** Not assigned (`null`)

