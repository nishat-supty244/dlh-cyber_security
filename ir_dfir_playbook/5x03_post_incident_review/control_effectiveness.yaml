
# MedDefense - Task 1: Audit Control Effectiveness
# Incident ID: IR-2026-0414-01
# Case ID: LH-2026-0414-01
# Source: forensic_findings_summary.md

- phase: "Credential phishing and submission"
  att_ck_technique: "T1566.002, T1078"
  controls_expected:
    - "Email gateway phishing and URL filtering"
    - "DNS and web filtering for malicious domains"
    - "Phishing-resistant MFA"
    - "Azure AD risky sign-in detection"
  controls_fired:
    - "Proxy logging recorded access to the phishing domain"
    - "Proxy recorded credential submission at 18:14:41Z"
  controls_missed:
    - "Phishing domain was not blocked before submission"
    - "Azure AD risk signals were suppressed by compliant-device rule"
    - "No confirmed prevention of credential compromise"
  gap_severity: "critical"
  gap_reason: "Phishing succeeded and stolen credentials enabled subsequent account compromise."

- phase: "VPN access using stolen credentials from a foreign IP"
  att_ck_technique: "T1078"
  controls_expected:
    - "VPN multi-factor authentication"
    - "Conditional access based on device and location"
    - "Foreign IP and impossible-travel detection"
    - "SIEM correlation of suspicious authentication"
  controls_fired:
    - "Authentication evidence identified suspicious account activity"
    - "Azure AD risk signals were generated"
  controls_missed:
    - "Conditional access compliant-device rule suppressed risk signals"
    - "No confirmed prevention of suspicious foreign access"
    - "VPN session and MFA enforcement require verification"
  gap_severity: "critical"
  gap_reason: "Compromised credentials were associated with suspicious foreign authentication while conditional access risk signals were suppressed."

- phase: "PowerShell to MSBuild LOLBin execution"
  att_ck_technique: "T1127.001"
  controls_expected:
    - "EDR process creation monitoring"
    - "Application control restricting MSBuild execution"
    - "PowerShell script block logging"
    - "SIEM detection of suspicious process chains"
  controls_fired:
    - "EDR detected PowerShell spawning MSBuild"
    - "Wazuh alert A-20260414-9841 triggered"
    - "Memory evidence confirmed the process relationship"
  controls_missed:
    - "Malicious MSBuild execution was not prevented"
    - "Application control did not demonstrably block the loader"
    - "Malicious payload executed before containment"
  gap_severity: "high"
  gap_reason: "Detection occurred, but MSBuild executed the malicious loader without confirmed preventive blocking."

- phase: "C2 beaconing to external IPs"
  att_ck_technique: "T1071.001"
  controls_expected:
    - "Outbound firewall restrictions"
    - "Proxy and network traffic monitoring"
    - "C2 beaconing detection"
    - "Threat intelligence IP blocking"
  controls_fired:
    - "EDR recorded outbound traffic to 185.220.101.47"
    - "Memory confirmed established TCP connection to primary C2"
    - "Forensics identified secondary C2 at 91.234.99.107"
  controls_missed:
    - "Primary C2 connection was not prevented"
    - "Secondary C2 communication occurred on WST-WS-017"
    - "No confirmed automatic C2 blocking before containment"
  gap_severity: "critical"
  gap_reason: "Compromised hosts established communication with two external C2 destinations without confirmed preventive blocking."

- phase: "LSASS credential access and Kerberos ticket extraction"
  att_ck_technique: "T1003.001, T1558.003"
  controls_expected:
    - "Windows Credential Guard and LSASS protection"
    - "EDR detection of suspicious LSASS access"
    - "Kerberos ticket anomaly monitoring"
    - "SIEM credential theft correlation"
  controls_fired:
    - "Memory forensics identified NTLM hash material in LSASS"
    - "Forensics identified Kerberos-based lateral authentication"
  controls_missed:
    - "Credential access was not demonstrably prevented"
    - "No confirmed real-time credential theft alert"
    - "Kerberos ticket abuse detection was not established"
  gap_severity: "critical"
  gap_reason: "Credential material and Kerberos-related activity were identified without evidence of effective real-time prevention or detection."

- phase: "Lateral movement and PHI access"
  att_ck_technique: "T1550.003, T1078"
  controls_expected:
    - "Network segmentation between clinical systems"
    - "Least-privilege access to sensitive PHI"
    - "Detection of abnormal Kerberos authentication"
    - "Monitoring of sensitive file access"
    - "DLP monitoring for potential data exfiltration"
  controls_fired:
    - "Forensics confirmed lateral activity on WST-WS-017"
    - "AD logs recorded 14 patient-report PDF reads"
    - "Forensic analysis identified affected clinical systems"
  controls_missed:
    - "Lateral movement was not demonstrably prevented"
    - "Access controls permitted reading 14 PHI reports"
    - "No confirmed real-time alert for abnormal PHI access"
    - "DLP effectiveness remains unverified"
  gap_severity: "critical"
  gap_reason: "The attacker reached additional clinical systems and accessed 14 PHI reports without confirmed effective prevention."
