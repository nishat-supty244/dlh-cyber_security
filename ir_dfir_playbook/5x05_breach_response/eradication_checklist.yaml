    target_host: CS-WS-101
    description: Remove malicious beacon process and executable.
    command_or_action: >-
      Preserve evidence, then use authorized EDR to terminate
      and quarantine C:\ProgramData\Microsoft\svchost32.exe.
    verification_command: >-
      Get-Process svchost32 -ErrorAction SilentlyContinue;
      Test-Path 'C:\ProgramData\Microsoft\svchost32.exe';
      review EDR process history for the last 24 hours.
    expected_verification_result: >-
      No malicious process, no executable, and no related
      malicious process tree in the last 24 hours.
    status: pending
    executed_at: null
    executed_by: null

