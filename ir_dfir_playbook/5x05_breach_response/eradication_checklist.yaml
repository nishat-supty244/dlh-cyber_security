indicators:
  malicious_process: 'C:\ProgramData\Microsoft\svchost32.exe'
  malicious_service: WinHealthSvc
  ransomware_script: 'C:\Windows\System32\encryption_staging.ps1'
  c2_domain: staging.office365-cdn.net
  c2_ip: 45.152.66.114
  exposed_account: 'MEDDEFENSE\jdoe'

notes:
  - Preserve forensic evidence before deleting malicious artifacts.
  - Execute actions only in authorized MedDefense systems.
  - Do not mark complete without saved verification output.
  - Historical sample logs do not prove eradication.
  - Coordinate file-server changes with clinical operations.
  - Investigate SCHED-SVR-01 before final recovery approval.

