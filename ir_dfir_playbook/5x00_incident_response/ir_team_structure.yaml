
roles:
  IR_Commander:
    primary: "James Chen, SOC Lead"
    backup: "Robert Kim, Infrastructure Lead"
    responsibilities:
      - Owns the incident through closure
      - Runs the incident bridge and timeline
      - Authorizes containment actions within authority ceiling
    authority_ceiling: SEV2

  Technical_Lead:
    primary: "Robert Kim, Infrastructure Lead"
    backup: "Mike Torres, Network Engineer"
    responsibilities:
      - Leads technical investigation and evidence collection
      - Coordinates containment and system isolation
      - Oversees technical recovery and restoration
    authority_ceiling: SEV2

  Communications_Lead:
    primary: "Marcus Webb, Communications Director"
    backup: "Sarah Park, IT Director"
    responsibilities:
      - Coordinates internal and external incident communications
      - Prepares incident updates for staff and leadership
      - Distributes communications after required approval
    authority_ceiling: SEV2

  Legal_Liaison:
    primary: "Helena Reyes, General Counsel"
    backup: "Dr. Patricia Morales, CISO"
    responsibilities:
      - Assesses HIPAA and state breach notification obligations
      - Coordinates legal review and regulatory notifications
      - Advises on litigation holds and evidence preservation
    authority_ceiling: SEV2

  Executive_Sponsor:
    primary: "Dr. Patricia Morales, CISO"
    backup: "Sarah Park, IT Director"
    responsibilities:
      - Provides executive oversight and resources
      - Authorizes critical SEV1 response decisions
      - Reports major incidents to executive leadership
    authority_ceiling: SEV1

  Scribe:
    primary: "Mike Torres, Network Engineer"
    backup: "James Chen, SOC Lead"
    responsibilities:
      - Maintains the incident timeline and event log
      - Records decisions, actions, and timestamps
      - Documents evidence references and incident status
    authority_ceiling: SEV4

escalation:
  SEV1:
    on_detection:
      - IR_Commander
      - Technical_Lead
      - Executive_Sponsor
      - Legal_Liaison
      - Communications_Lead
      - Scribe
    on_confirmation:
      - IR_Commander
      - Executive_Sponsor
      - Legal_Liaison
      - Communications_Lead
    on_scope_expansion:
      - IR_Commander
      - Technical_Lead
      - Executive_Sponsor
      - Legal_Liaison
      - Communications_Lead
    time_threshold_minutes_to_escalate: 15

  SEV2:
    on_detection:
      - IR_Commander
      - Technical_Lead
    on_confirmation:
      - Communications_Lead
      - Legal_Liaison
    on_scope_expansion:
      - Executive_Sponsor
      - Technical_Lead
      - Legal_Liaison
    time_threshold_minutes_to_escalate: 60

  SEV3:
    on_detection:
      - IR_Commander
      - Technical_Lead
    on_confirmation:
      - IR_Commander
      - Technical_Lead
    on_scope_expansion:
      - Executive_Sponsor
      - Legal_Liaison
    time_threshold_minutes_to_escalate: 120

  SEV4:
    on_detection:
      - IR_Commander
      - Scribe
    on_confirmation:
      - IR_Commander
      - Technical_Lead
    on_scope_expansion:
      - IR_Commander
      - Technical_Lead
    time_threshold_minutes_to_escalate: 240
