
roles:
  IR_Commander:
    primary: "James Chen, SOC Lead"
    backup: "Robert Kim, Infrastructure Lead"
    responsibilities:
      - Owns incident coordination through closure
      - Runs the incident bridge and maintains the timeline
      - Authorizes containment within assigned authority
    authority_ceiling: SEV2

  Technical_Lead:
    primary: "Robert Kim, Infrastructure Lead"
    backup: "Sarah Park, IT Director"
    responsibilities:
      - Leads technical investigation and evidence collection
      - Coordinates system isolation and containment
      - Oversees recovery of affected systems
    authority_ceiling: SEV2

  Communications_Lead:
    primary: "Marcus Webb, Communications Director"
    backup: "Sarah Park, IT Director"
    responsibilities:
      - Prepares internal and external incident updates
      - Coordinates approved messages to staff and patients
      - Ensures communications follow authorized decisions
    authority_ceiling: SEV2

  Legal_Liaison:
    primary: "Helena Reyes, General Counsel"
    backup: "Dr. Patricia Morales, CISO"
    responsibilities:
      - Assesses HIPAA and applicable state notification obligations
      - Advises on legal risks and evidence preservation
      - Coordinates regulatory notification decisions
    authority_ceiling: SEV2

  Executive_Sponsor:
    primary: "Dr. Patricia Morales, CISO"
    backup: "Sarah Park, IT Director"
    responsibilities:
      - Provides executive oversight and resources
      - Authorizes SEV1 response decisions
      - Reports major incidents to executive leadership
    authority_ceiling: SEV1

  Scribe:
    primary: "Mike Torres, Network Engineer"
    backup: "James Chen, SOC Lead"
    responsibilities:
      - Records incident events and timestamps
      - Documents decisions and response actions
      - Maintains incident logs and evidence references
    authority_ceiling: SEV4

escalation:
  SEV1:
    on_detection:
      - IR_Commander
      - Technical_Lead
      - Executive_Sponsor
      - Scribe
    on_confirmation:
      - Legal_Liaison
      - Communications_Lead
    on_scope_expansion:
      - Executive_Sponsor
      - Legal_Liaison
      - Communications_Lead
    time_threshold_minutes_to_escalate: 15

  SEV2:
    on_detection:
      - IR_Commander
      - Technical_Lead
      - Scribe
    on_confirmation:
      - Communications_Lead
      - Legal_Liaison
    on_scope_expansion:
      - Executive_Sponsor
    time_threshold_minutes_to_escalate: 60

  SEV3:
    on_detection:
      - IR_Commander
      - Scribe
    on_confirmation:
      - Technical_Lead
    on_scope_expansion:
      - Legal_Liaison
      - Executive_Sponsor
    time_threshold_minutes_to_escalate: 120

  SEV4:
    on_detection:
      - Scribe
    on_confirmation:
      - IR_Commander
    on_scope_expansion:
      - Technical_Lead
    time_threshold_minutes_to_escalate: 240
