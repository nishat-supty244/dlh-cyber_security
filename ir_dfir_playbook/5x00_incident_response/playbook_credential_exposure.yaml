
playbook_id: "PB-001"
title: "Credential Exposure Incident Response"
owner_role: "IR_Commander"

applies_to:
  triggers:
    - "User reports entering credentials on a fake Microsoft login page"
    - "Azure AD detects successful sign-in from an unusual foreign IP"
    - "Splunk detects suspicious authentication following phishing"
    - "Wazuh detects suspicious activity linked to the compromised account"
  indicators:
    - "Successful foreign IP sign-in within one hour of credential exposure"
    - "Unrecognized Azure MFA push requests or device registration"
    - "Unusual VPN authentication using the affected account"
    - "Unexpected mailbox access or forwarding rule changes"
    - "Unusual Epic access or patient record activity"

severity_mapping:
  initial: "SEV2"
  escalate_if:
    - "Confirmed broad exposure of patient ePHI"
    - "Compromise affects multiple clinical accounts or sites"
    - "Patient safety or critical clinical service availability is affected"
    - "Attacker gains privileged Active Directory or Azure AD access"

immediate_actions:
  - step: "Open an incident record, assign SEV2, and record the detection time, affected account, and reported phishing time"
    owner: "IR_Commander"
    timebox_minutes: 2

  - step: "Notify the Technical Lead and establish the incident bridge"
    owner: "IR_Commander"
    timebox_minutes: 2

  - step: "Export authentication logs, Azure AD sign-in logs, affected mailbox data, and recent data access audit logs before credential reset"
    owner: "Technical_Lead"
    timebox_minutes: 5

  - step: "Identify the foreign IP, exposure window, active sessions, VPN access, and Epic access associated with the account"
    owner: "Technical_Lead"
    timebox_minutes: 3

  - step: "Decide whether to reset credentials immediately or briefly monitor the attacker session under controlled conditions"
    owner: "IR_Commander"
    timebox_minutes: 1

  - step: "Begin approved containment and document all actions and timestamps"
    owner: "Technical_Lead"
    timebox_minutes: 2

evidence_preservation:
  - artifact: "On-prem Active Directory authentication logs"
    method: "Export relevant domain controller security events, including successful and failed logons, account changes, timestamps, and source IP addresses"
    before_step: "Active Directory password reset"

  - artifact: "Azure AD sign-in logs"
    method: "Export sign-in records with source IP, location, device, application, MFA status, session identifiers where available, and timestamps"
    before_step: "Azure AD session revocation"

  - artifact: "Affected mailbox export"
    method: "Preserve relevant mailbox content, phishing messages, forwarding rules, inbox rules, and available mailbox audit records using authorized Microsoft 365 administrative tools"
    before_step: "Active Directory password reset"

  - artifact: "Recent data access audit export"
    method: "Export available Epic, LIS, Microsoft 365, and Splunk audit records covering the suspected exposure window"
    before_step: "Epic session termination"

  - artifact: "VPN authentication and session logs"
    method: "Export VPN login history, active session identifiers, assigned IP addresses, and authentication timestamps"
    before_step: "VPN token revocation"

  - artifact: "MFA registration and authentication history"
    method: "Export Azure MFA registration changes, authentication attempts, device information, and suspicious push requests"
    before_step: "MFA device reset"

containment_actions:
  - step: "Reset the compromised account password in on-prem Active Directory and verify synchronization to Azure AD"
    owner: "Technical_Lead"
    decision_point: "IR Commander authorizes immediate reset after minimum available evidence capture; do not delay if active compromise threatens patient data or services"
    trade_off: "Stops reuse of the stolen password but may interrupt legitimate access and reduce visibility into subsequent attacker authentication attempts"

  - step: "Revoke all active Azure AD sign-in sessions and refresh tokens for the compromised account"
    owner: "Technical_Lead"
    decision_point: "Execute immediately after evidence capture and password reset; record revocation time and verify session invalidation"
    trade_off: "Reduces attacker access but also signs out legitimate users and ends observation of the active session"

  - step: "Reset compromised or unrecognized Azure MFA device registrations and require secure re-enrollment"
    owner: "Technical_Lead"
    decision_point: "Confirm user identity through an approved independent channel before enrolling a replacement MFA device"
    trade_off: "Removes attacker-controlled MFA methods but temporarily interrupts legitimate MFA access"

  - step: "Revoke active VPN sessions and VPN authentication tokens associated with the compromised account"
    owner: "Technical_Lead"
    decision_point: "Coordinate with the Network Engineer and confirm whether the account supports an active clinical workflow"
    trade_off: "Blocks possible remote attacker access but may disconnect legitimate remote work sessions"

  - step: "Terminate active Epic Hyperspace sessions associated with the compromised account"
    owner: "Technical_Lead"
    decision_point: "Coordinate with the IT Director and clinical operations before termination when active patient care could be interrupted"
    trade_off: "Prevents further unauthorized Epic access but may interrupt clinical workflows and require the legitimate user to sign in again"

  - step: "Choose immediate containment or a brief, explicitly authorized monitoring period"
    owner: "IR_Commander"
    decision_point: "Default to immediate containment after minimum evidence capture. Brief monitoring is permitted only with explicit IR Commander authorization, no indication of ongoing ePHI access or patient safety risk, and a documented stop condition. Escalate to the CISO if SEV1 conditions arise"
    trade_off: "Immediate reset protects the account but ends attacker session visibility. Brief monitoring may reveal attacker activity but increases the risk of additional compromise and patient data exposure"

eradication_actions:
  - "Remove unauthorized mailbox forwarding rules, inbox rules, and delegated access"
  - "Remove unrecognized Azure AD MFA registrations and unauthorized authentication methods"
  - "Revoke unauthorized application consent grants and persistent access mechanisms"
  - "Inspect the affected workstation using Wazuh EDR or Microsoft Defender for Endpoint and remove confirmed malicious artifacts"
  - "Reset any additional credentials found exposed during the investigation"

recovery_validation:
  - check: "Active Directory and Azure AD account security"
    criterion: "New password is synchronized, unauthorized sessions are revoked, and no suspicious sign-ins continue"

  - check: "MFA enrollment"
    criterion: "Only verified MFA methods remain registered and legitimate authentication succeeds"

  - check: "VPN access"
    criterion: "Unauthorized VPN sessions and tokens are invalidated and legitimate access is restored"

  - check: "Epic clinical access"
    criterion: "Unauthorized sessions are terminated, suspicious patient record access has stopped, and legitimate clinical access is restored"

  - check: "Mailbox security"
    criterion: "Unauthorized forwarding rules, delegates, and suspicious application permissions are removed"

  - check: "Security monitoring"
    criterion: "Splunk, Azure AD, and endpoint telemetry show no further unauthorized activity during the defined monitoring period"

communication_plan:
  - audience: "IR_Commander"
    trigger: "Immediately after confirmed foreign IP sign-in"
    template: "incident_notification_internal.md"

  - audience: "Technical_Lead"
    trigger: "At SEV2 incident declaration"
    template: "technical_incident_update.md"

  - audience: "Executive_Sponsor"
    trigger: "When severity reaches SEV1 or incident scope expands"
    template: "executive_incident_update.md"

  - audience: "Legal_Liaison"
    trigger: "When ePHI may have been accessible during the credential exposure window"
    template: "legal_hipaa_assessment.md"

  - audience: "Communications_Lead"
    trigger: "When compromise is confirmed or approved stakeholder communication is required"
    template: "incident_communications_update.md"

escalation_triggers:
  - "Escalate to SEV1 if confirmed broad ePHI exposure is identified"
  - "Escalate to SEV1 if patient safety or critical clinical services are seriously affected"
  - "Escalate when additional accounts, systems, or MedDefense sites are compromised"
  - "Escalate to the Executive Sponsor if SEV2 containment makes no meaningful progress within 60 minutes"
  - "Notify the Legal Liaison when ePHI was accessible or may have been accessed during the exposure window"
  - "Reassess severity immediately if the attacker obtains privileged Active Directory or Azure AD access"

post_incident_tasks:
  - "Complete the incident timeline using authentication, Azure AD, VPN, mailbox, and Epic audit evidence"
  - "Document the phishing URL, attacker IP addresses, compromised account, exposure window, and containment timestamps"
  - "Assess whether ePHI was accessible or accessed during the exposure window and document the findings for HIPAA breach assessment"
  - "Have the Legal Liaison determine applicable HIPAA and state breach notification obligations"
  - "Review MFA configuration, conditional access policies, phishing protection, and suspicious login detection"
  - "Document containment decisions, evidence preservation, and any patient care interruptions"
  - "Conduct a post-incident review and update detection rules and playbooks"
