# MedDefense dnsmasq upstream forwarders
# Shipped with the project. Installed at /etc/dnsmasq.d/meddefense-upstream.conf
# by the project handoff step, before 13-dns_filtering.sh is run.
#
# Do not resolve using /etc/resolv.conf: forward only to the upstreams
# listed below. This keeps DNS filtering deterministic and independent
# of whatever resolver the host happens to be configured with.
no-resolv
server=1.1.1.1
server=8.8.8.8
