#!/usr/sbin/nft -f

# Flush existing rules to prevent accumulation during atomic re-loads
flush ruleset

table inet meddefense {
    # Named sets per zone containing their respective CIDRs, plus an all_set for wildcard sources
    set all_set {
        type ipv4_addr
        flags interval
        elements = { 0.0.0.0/0 }
    }
    set dmz_set {
        type ipv4_addr
        flags interval
        elements = { 10.0.1.0/24 }
    }
    set internal_set {
        type ipv4_addr
        flags interval
        elements = { 10.0.2.0/24 }
    }
    set mgmt_set {
        type ipv4_addr
        flags interval
        elements = { 10.0.3.0/24 }
    }
    set meddev_set {
        type ipv4_addr
        flags interval
        elements = { 10.0.4.0/24 }
    }

    chain input {
        type filter hook input priority filter; policy drop;

        # Connection tracking state
        ct state established,related accept

        # Loopback interface traffic
        iif lo accept

        # Minimal ICMP acceptance
        ip protocol icmp accept
        ip6 nexthdr icmpv6 accept

        # Explicit allow rules for local termination (SSH/Management flows)
        tcp dport 22 accept
        tcp dport 4242 accept
        udp dport 53 accept
        tcp dport 53 accept

        # Deny terminal rule with logging
        log prefix "MEDDEFENSE-INPUT-DROP: " drop
    }

    chain forward {
        type filter hook forward priority filter; policy drop;

        # Connection tracking state for cross-zone forwarding
        ct state established,related accept
        ip saddr @mgmt_set ip daddr @internal_set tcp dport 22 accept
        ip saddr @mgmt_set ip daddr @dmz_set tcp dport 22 accept
        ip saddr @internal_set ip daddr @internal_set tcp dport 443 accept
        ip saddr @internal_set ip daddr @internal_set tcp dport 3306 accept
        ip saddr @dmz_set ip daddr @internal_set tcp dport 3306 accept
        ip saddr @meddev_set ip daddr @internal_set tcp dport 4242 accept
        ip saddr @meddev_set ip daddr @internal_set tcp dport 443 accept
        ip saddr @all_set ip daddr @mgmt_set udp dport 53 accept
        ip saddr @all_set ip daddr @mgmt_set tcp dport 53 accept
        ip saddr @mgmt_set ip daddr @meddev_set tcp dport 22 accept
        ip saddr @mgmt_set ip daddr @meddev_set tcp dport 4242 accept

        # Deny terminal rule with logging for cross-zone violations
        log prefix "MEDDEFENSE-FORWARD-DROP: " drop
    }

    chain output {
        type filter hook output priority filter; policy accept;

        # Explicit drops for zones restricted from outbound traffic
        ip daddr @meddev_set ip daddr != { 10.0.0.0/8 } drop

        # Deny terminal rule with logging
        log prefix "MEDDEFENSE-OUTPUT-DROP: " drop
    }
}
