
title: Unseen Reconnaissance Tool Execution on Endpoints
id: c92b8d44-99a2-4c23-8d53-8829364f2b22
status: experimental
description: Detects the execution of command-line reconnaissance and discovery tools (whoami, net, systeminfo, tasklist, netstat, nmap) that were not observed during the baseline monitoring window, as flagged in the 3x01 anomaly report. Such behavior often indicates post-compromise environment enumeration and discovery.
author: MedDefense SOC
date: 2026/09/09
logsource:
  category: process_creation
detection:
  selection_windows:
    product: windows
    Image|endswith:
      - '\whoami.exe'
      - '\net.exe'
      - '\systeminfo.exe'
      - '\tasklist.exe'
      - '\netstat.exe'
      - '\nmap.exe'
      - '\nmap'
  selection_linux:
    product: linux
    Image|endswith:
      - '/whoami'
      - '/net'
      - '/systeminfo'
      - '/tasklist'
      - '/netstat'
      - '/nmap'
  baseline_filter:
    baseline_seen: false
  condition: (selection_windows or selection_linux) and baseline_filter
falsepositives:
  - System administrators performing manual troubleshooting or inventory checks.
  - Newly deployed diagnostic software tools authorized outside the standard baseline window.
level: medium
tags:
  - attack.discovery
  - attack.t1087
  - attack.t1082
