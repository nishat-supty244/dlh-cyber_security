title: SSH Repeated Authentication Failures from Single Source
id: d76b5c32-11a2-4e59-8f3e-9182746f5c10
status: experimental
description: Detects multiple SSH authentication failures originating from the same source IP within a short timeframe, indicating a potential brute force attack against Linux hosts. The data source is Linux authentication logs (auth.log/system logs), and the expected operational response is to review the source IP reputation, verify targeted user accounts, and temporarily block the IP via firewall rules if malicious intent is confirmed.
author: MedDefense SOC
date: 2026/09/09
logsource:
  product: linux
  service: auth
detection:
  selection:
    canonical_label: login_failure
    event_category: authentication
  timeframe: 120s
  condition: selection | count(src_ip) > 5
falsepositives:
  - Automated vulnerability scanners performing standard credential checks during scheduled audits.
  - Legitimate users repeatedly mistyping their passwords or keys following a credential update.
level: high
tags:
  - attack.credential_access
  - attack.t1110.001
